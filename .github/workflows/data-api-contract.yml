name: Data API Contract

on:
  workflow_dispatch:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test local catalog rules
        run: node --test tests/dataset-utils.test.js

      - name: Test live Data API contract
        run: node --test tests/data-api-contract.test.js
